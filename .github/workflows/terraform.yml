name: "Terraform CI"

on:
  push:
    branches:
      - main
      - dev
      - uat
      - prod
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: "Validate"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Run Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Validate branch environments
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          validate_environment() {
            local environment="$1"
            local workspace="$2"

            echo "Validating envs/${environment} with workspace ${workspace}"
            pushd "envs/${environment}" >/dev/null
            terraform init -reconfigure

            if terraform workspace select "${workspace}" 2>/dev/null; then
              :
            else
              terraform workspace new "${workspace}"
            fi

            terraform validate
            popd >/dev/null
          }

          case "${SOURCE_BRANCH}" in
            main)
              validate_environment dev default
              validate_environment uat default
              validate_environment prod default
              ;;
            dev|uat|prod)
              validate_environment "${SOURCE_BRANCH}" "${SOURCE_BRANCH}"
              ;;
            *)
              echo "Unsupported branch '${SOURCE_BRANCH}'; validating all environments with default workspace"
              validate_environment dev default
              validate_environment uat default
              validate_environment prod default
              ;;
          esac
